<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Frontline Rush 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101a;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));text-shadow:0 2px 4px #000}
.pill{background:#102133cc;border:1px solid #ffffff33;border-radius:14px;padding:7px 10px;font-weight:800}
#progress{position:absolute;left:18%;right:18%;top:14px;height:8px;border-radius:9px;background:#102133aa;border:1px solid #ffffff44;overflow:hidden}
#bar{height:100%;width:8%;background:linear-gradient(90deg,#27d7ff,#5cff85)}
#start,#end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#06101acc,#06101aee);z-index:5}
.card{width:min(88vw,420px);padding:26px;border-radius:24px;background:#102133f2;border:1px solid #ffffff2e;box-shadow:0 20px 70px #0008;text-align:center;color:white}
h1{margin:0 0 8px;font-size:34px;letter-spacing:-1px}
p{opacity:.82;line-height:1.45}
button{border:0;border-radius:16px;padding:15px 25px;background:#31d5ff;color:#04121b;font-size:18px;font-weight:900;box-shadow:0 8px 25px #00cfff44}
.small{font-size:12px;opacity:.65;margin-top:14px}
#end{display:none}
#weapon{position:absolute;left:50%;transform:translateX(-50%);top:42px;font-size:13px}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="top">
    <div class="pill">👥 <span id="army">8</span></div>
    <div class="pill">🪙 <span id="coins">0</span></div>
  </div>
  <div id="progress"><div id="bar"></div></div>
  <div id="weapon" class="pill">RIFLE • Lv 1</div>
</div>
<div id="start"><div class="card">
  <h1>FRONTLINE RUSH</h1>
  <p>Lead your squad down the battlefield. Drag left or right, shoot enemies automatically, and choose the best gates.</p>
  <button id="play">PLAY</button>
  <div class="small">Made as an original 3D game inspired by the mobile-ad army-runner genre.</div>
</div></div>
<div id="end"><div class="card">
  <h1 id="result">MISSION COMPLETE</h1>
  <p id="resultText"></p>
  <button id="again">PLAY AGAIN</button>
</div></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x82c8df);
scene.fog = new THREE.Fog(0x82c8df, 35, 115);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 220);
camera.position.set(0,6.8,12);
camera.lookAt(0,1,-18);

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xcff6ff,0x27453a,2.3));
const sun=new THREE.DirectionalLight(0xffffff,3.2);
sun.position.set(-15,25,12); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mat = (c,rough=0.8)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});
const blue=mat(0x1976d2), blue2=mat(0x55c7ff), skin=mat(0xf0b07a), dark=mat(0x162331), red=mat(0xe53c45), red2=mat(0xff5962), gold=mat(0xffc928), white=mat(0xf2f7fb), green=mat(0x3fe27c);

const road = new THREE.Mesh(new THREE.BoxGeometry(14,.35,190),mat(0x55616a));
road.position.set(0,-.25,-62); road.receiveShadow=true; scene.add(road);
const shoulder=mat(0x35443d);
for(const x of [-8.1,8.1]){
 const s=new THREE.Mesh(new THREE.BoxGeometry(2,.25,190),shoulder);s.position.set(x,-.28,-62);scene.add(s);
}
for(let z=-5;z>-145;z-=8){
 const line=new THREE.Mesh(new THREE.BoxGeometry(.22,.03,4.2),white);
 line.position.set(0,-.04,z); scene.add(line);
}
const water=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x2f9cc5,.45));
water.rotation.x=-Math.PI/2; water.position.set(0,-.55,-65); scene.add(water);

function makeTree(x,z){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,1.5,7),mat(0x6d432a)); trunk.position.y=.5;
 const crown=new THREE.Mesh(new THREE.ConeGeometry(1.1,2.7,7),mat(0x25834c)); crown.position.y=2.25;
 g.add(trunk,crown);g.position.set(x,0,z);scene.add(g);
}
for(let z=-10;z>-140;z-=12){makeTree(-11-(z%3),z);makeTree(11+(z%2),z-5)}

function soldier(color=blue, enemy=false){
 const g=new THREE.Group();
 const torso=new THREE.Mesh(new THREE.BoxGeometry(.55,.8,.36),color); torso.position.y=1.15; torso.castShadow=true;
 const head=new THREE.Mesh(new THREE.SphereGeometry(.27,12,8),skin); head.position.y=1.78; head.castShadow=true;
 const helmet=new THREE.Mesh(new THREE.SphereGeometry(.31,12,8,0,Math.PI*2,0,Math.PI*.52),enemy?red2:blue2); helmet.position.y=1.91;
 const brim=new THREE.Mesh(new THREE.BoxGeometry(.48,.08,.35),enemy?red2:blue2);brim.position.set(0,1.83,.08);
 const armL=new THREE.Mesh(new THREE.BoxGeometry(.16,.55,.16),color);armL.position.set(-.38,1.18,0);
 const armR=armL.clone();armR.position.x=.38;
 const legL=new THREE.Mesh(new THREE.BoxGeometry(.18,.62,.2),dark);legL.position.set(-.16,.43,0);
 const legR=legL.clone();legR.position.x=.16;
 const gun=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.8),dark);gun.position.set(0,1.2,-.48);
 g.add(torso,head,helmet,brim,armL,armR,legL,legR,gun);
 g.userData={phase:Math.random()*6.28,gun};
 return g;
}

const squad=[];
let armyCount=8, targetX=0, runZ=0, coins=0, weaponLv=1, alive=true, boss=null;
function rebuildSquad(){
 while(squad.length<armyCount){
  const s=soldier(blue,false);scene.add(s);squad.push(s);
 }
 while(squad.length>armyCount){scene.remove(squad.pop());}
}
rebuildSquad();

function formation(){
 const n=squad.length, cols=Math.min(5,Math.max(2,Math.ceil(Math.sqrt(n))));
 squad.forEach((s,i)=>{
   const row=Math.floor(i/cols), col=i%cols;
   const width=(Math.min(cols,5)-1)*1.05;
   const x=(col*1.05-width/2)+(row%2?.15:0);
   s.position.x += (targetX+x-s.position.x)*.12;
   s.position.y = 0;
   s.position.z = 7 + row*.8;
   s.rotation.y = Math.PI;
   const bob=Math.sin(performance.now()/110+s.userData.phase)*.05;
   s.position.y=bob;
 });
}

const gates=[], enemies=[], bullets=[], pickups=[], particles=[];
function clearArr(arr,fn){while(arr.length){fn(arr.pop())}}

function gate(z, left, right){
 const g=new THREE.Group(); g.position.z=z; g.userData={left,right,done:false};
 for(const [x,val,positive] of [[-3.4,left,left>=0],[3.4,right,right>=0]]){
   const frame=new THREE.Mesh(new THREE.BoxGeometry(.22,4,.22),positive?blue2:red2);frame.position.set(x,2,0);
   const top=new THREE.Mesh(new THREE.BoxGeometry(7,.22,.22),positive?blue2:red2);top.position.set(0,3.8,0);
   const panel=new THREE.Mesh(new THREE.BoxGeometry(6.4,2.5,.12),new THREE.MeshStandardMaterial({color:positive?0x1385d8:0xd92e3e,transparent:true,opacity:.25}));
   panel.position.set(x/2,1.9,0);
   g.add(frame,top,panel);
   const c=document.createElement('canvas');c.width=512;c.height=256;const ctx=c.getContext('2d');
   ctx.fillStyle='#fff';ctx.font='bold 120px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((val>=0?'+':'')+val,256,130);
   const tex=new THREE.CanvasTexture(c);
   const label=new THREE.Mesh(new THREE.PlaneGeometry(2.7,1.35),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
   label.position.set(x,2, -.15);g.add(label);
 }
 scene.add(g);gates.push(g);
}
for(let z=-25;z>-125;z-=25) gate(z, Math.random()<.5?6:12, Math.random()<.5?4:10);

function enemyWave(z,count=7){
 for(let i=0;i<count;i++){
   const e=soldier(red,true);e.position.set((Math.random()-.5)*9,0,z-Math.random()*3);
   e.userData.hp=3+Math.floor(Math.random()*3)+Math.floor(-z/55);e.userData.max=e.userData.hp;
   scene.add(e);enemies.push(e);
 }
}
enemyWave(-48,8);enemyWave(-78,10);enemyWave(-108,13);

function bullet(from,to){
 const dir=new THREE.Vector3().subVectors(to,from), len=dir.length();
 const b=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,len,5),gold);
 b.position.copy(from).add(to).multiplyScalar(.5);b.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
 b.userData={v:dir.multiplyScalar(34),life:1.2};scene.add(b);bullets.push(b);
}
function muzzleFlash(p){
 const m=new THREE.Mesh(new THREE.SphereGeometry(.12,6,6),gold);m.position.copy(p);scene.add(m);
 particles.push({m,life:.08,vel:new THREE.Vector3(0,0,0)});
}
function nearestEnemy(){
 let best=null,d=1e9;
 for(const e of enemies){const dd=e.position.distanceToSquared(new THREE.Vector3(targetX,1,runZ-10));if(dd<d){d=dd;best=e;}}
 return best;
}
function shoot(){
 const e=nearestEnemy(); if(!e)return;
 const shooters=Math.min(squad.length,12);
 for(let i=0;i<shooters;i+=2){
   const s=squad[i]; const from=s.position.clone().add(new THREE.Vector3(0,1.25,-.5));
   bullet(from,e.position.clone().add(new THREE.Vector3(0,1,0)));muzzleFlash(from);
 }
}

let last=performance.now(), fireTimer=0, spawnTimer=0;
function applyGate(g){
 const x=g.position.x;
 const val=x<0?g.userData.left:g.userData.right;
 armyCount=Math.max(1,Math.min(80,armyCount+val));
 rebuildSquad();
 g.userData.done=true;
 for(let i=0;i<12;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.07,5,5),gold);p.position.set(x/2,1.8,g.position.z);scene.add(p);particles.push({m:p,life:.5,vel:new THREE.Vector3((Math.random()-.5)*4,Math.random()*4,Math.random()*2)});}
}
function spawnWeapon(z){
 const box=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),white);
 box.position.set((Math.random()-.5)*8,1,z);
 box.userData={weapon:true};scene.add(box);pickups.push(box);
}
spawnWeapon(-63);spawnWeapon(-96);

function makeBoss(){
 boss=soldier(red,true); boss.scale.set(3,3,3); boss.position.set(0,0,-132); boss.userData.hp=260;boss.userData.max=260;
 scene.add(boss);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(2.4,.08,8,32),gold);ring.rotation.x=Math.PI/2;ring.position.y=5.2;boss.add(ring);
}

function reset(){
 alive=true; armyCount=8;coins=0;weaponLv=1;targetX=0;runZ=0;boss=null;
 document.getElementById('coins').textContent=coins;document.getElementById('weapon').textContent='RIFLE • Lv 1';
 clearArr(enemies,e=>scene.remove(e));clearArr(gates,g=>scene.remove(g));clearArr(pickups,p=>scene.remove(p));clearArr(bullets,b=>scene.remove(b));
 rebuildSquad();
 for(let z=-25;z>-125;z-=25)gate(z,Math.random()<.5?6:12,Math.random()<.5?4:10);
 enemyWave(-48,8);enemyWave(-78,10);enemyWave(-108,13);spawnWeapon(-63);spawnWeapon(-96);
 document.getElementById('end').style.display='none';
}
function finish(win){
 alive=false;
 document.getElementById('result').textContent=win?'MISSION COMPLETE':'SQUAD DEFEATED';
 document.getElementById('resultText').textContent=win?`You reached the command point with ${armyCount} soldiers and ${coins} coins.`:`Your squad was overwhelmed. You finished with ${armyCount} soldiers.`;
 document.getElementById('end').style.display='flex';
}

function update(dt){
 if(!alive)return;
 runZ-=dt*5.5;
 formation();
 camera.position.x+=(targetX*.35-camera.position.x)*.08;
 camera.position.z=12;
 camera.lookAt(targetX*.25,1.2,runZ-18);

 for(const g of gates){
   g.position.z += dt*5.5;
   if(!g.userData.done && g.position.z>runZ+5){applyGate(g);g.userData.done=true;}
 }
 for(let i=gates.length-1;i>=0;i--)if(gates[i].position.z>20){scene.remove(gates[i]);gates.splice(i,1);}

 fireTimer-=dt;if(fireTimer<=0){shoot();fireTimer=Math.max(.14,.34-weaponLv*.035);}
 for(const e of enemies){
   e.position.z += dt*(2.2+Math.min(2,-e.position.z/80));
   e.position.x += (targetX-e.position.x)*dt*.18;
   const d=e.position.distanceTo(new THREE.Vector3(targetX,0,runZ+4));
   if(d<1.4){armyCount=Math.max(1,armyCount-1);e.userData.hp=0;}
 }
 for(let i=enemies.length-1;i>=0;i--)if(enemies[i].userData.hp<=0 || enemies[i].position.z>20){scene.remove(enemies[i]);enemies.splice(i,1);}

 for(const b of bullets){
   b.position.addScaledVector(b.userData.v,dt);b.userData.life-=dt;
   for(const e of enemies){if(e.position.distanceTo(b.position)<.65){e.userData.hp--;b.userData.life=0;coins++;break;}}
   if(boss&&boss.position.distanceTo(b.position)<1.8){boss.userData.hp--;b.userData.life=0;}
 }
 for(let i=bullets.length-1;i>=0;i--)if(bullets[i].userData.life<=0){scene.remove(bullets[i]);bullets.splice(i,1);}

 for(let i=pickups.length-1;i>=0;i--){
   const p=pickups[i];p.rotation.y+=dt*2;
   if(Math.abs(p.position.z-runZ)<3 && Math.abs(p.position.x-targetX)<2){
     weaponLv=Math.min(9,weaponLv+1);document.getElementById('weapon').textContent='RIFLE • Lv '+weaponLv;
     scene.remove(p);pickups.splice(i);
   }
 }
 if(runZ<-124&&!boss)makeBoss();
 if(boss){
   boss.position.z+=dt*2;
   if(boss.userData.hp<=0)finish(true);
   if(boss.position.z>runZ+4){finish(false);}
 }
 if(armyCount<=0)finish(false);
 document.getElementById('army').textContent=armyCount;
 document.getElementById('coins').textContent=coins;
 document.getElementById('bar').style.width=Math.min(100,Math.max(5,(-runZ/140)*100))+'%';
}

function loop(t){
 const dt=Math.min(.035,(t-last)/1000);last=t;
 update(dt);
 renderer.render(scene,camera);
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

let dragging=false,lastX=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;
 const dx=e.clientX-lastX;lastX=e.clientX;
 targetX=Math.max(-5.2,Math.min(5.2,targetX+dx*.022));
});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')targetX-=1;if(e.key==='ArrowRight')targetX+=1;targetX=Math.max(-5.2,Math.min(5.2,targetX));});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

document.getElementById('play').onclick=()=>{reset();document.getElementById('start').style.display='none';};
document.getElementById('again').onclick=()=>{reset();};
</script>
</body>
</html>
