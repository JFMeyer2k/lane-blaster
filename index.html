<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lane Blaster</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #10131a;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  touch-action: none;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
  color: white;
}

.hud {
  display: flex;
  justify-content: space-between;
  padding:
    calc(env(safe-area-inset-top) + 12px)
    14px
    0;
  font-weight: 800;
}

.pill {
  background: rgba(0,0,0,.55);
  border: 1px solid rgba(255,255,255,.17);
  border-radius: 20px;
  padding: 8px 12px;
  text-shadow: 0 2px 2px #000;
}

#hint {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom) + 15px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  background: rgba(0,0,0,.5);
  padding: 7px 12px;
  border-radius: 20px;
  white-space: nowrap;
}

#start {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.55);
  pointer-events: auto;
}

.card {
  width: min(86vw,390px);
  padding: 28px 22px;
  border-radius: 24px;
  text-align: center;
  background: rgba(16,21,30,.95);
  color: white;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}

.card h1 {
  font-size: 38px;
  margin: 0 0 8px;
}

.card p {
  line-height: 1.45;
  color: #d7dbe4;
}

.card b {
  color: #ffd42a;
}

#startBtn {
  border: 0;
  border-radius: 15px;
  background: #ffd42a;
  color: #171717;
  font-weight: 900;
  font-size: 20px;
  padding: 14px 28px;
  box-shadow: 0 5px #a77e00;
}

#startBtn:active {
  transform: translateY(3px);
  box-shadow: 0 2px #a77e00;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

  <div class="hud">

    <div class="pill">
      ⭐ <span id="score">0</span>
    </div>

    <div class="pill">
      ❤️ <span id="hp">3</span>
      &nbsp;
      ⚡ <span id="power">—</span>
    </div>

  </div>

  <div id="hint">
    Swipe left / right to change lanes
  </div>

</div>

<div id="start">

  <div class="card">

    <h1 id="title">
      LANE BLASTER
    </h1>

    <p id="description">
      Move between <b>3 lanes</b>,
      automatically shoot the enemies,
      and collect power-ups.
      <br><br>
      <b>Tap PLAY to start.</b>
    </p>

    <button id="startBtn">
      PLAY
    </button>

  </div>

</div>

<script>

"use strict";

/* =========================================================
   BASIC SETUP
========================================================= */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

const scoreElement =
  document.getElementById("score");

const hpElement =
  document.getElementById("hp");

const powerElement =
  document.getElementById("power");

const startScreen =
  document.getElementById("start");

const startButton =
  document.getElementById("startBtn");

const titleElement =
  document.getElementById("title");

const descriptionElement =
  document.getElementById("description");


let WIDTH = 0;
let HEIGHT = 0;
let DPR = 1;

function resizeCanvas() {

  DPR = Math.min(
    window.devicePixelRatio || 1,
    2
  );

  WIDTH = window.innerWidth;
  HEIGHT = window.innerHeight;

  canvas.width =
    WIDTH * DPR;

  canvas.height =
    HEIGHT * DPR;

  canvas.style.width =
    WIDTH + "px";

  canvas.style.height =
    HEIGHT + "px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();


/* =========================================================
   GAME STATE
========================================================= */

let gameRunning = false;

let lastTime = 0;

let score = 0;

let health = 3;

let powerTime = 0;

let playerLane = 1;

let spawnTimer = 0;

let fireTimer = 0;

let level = 1;

let shakeTimer = 0;


/* =========================================================
   GAME OBJECTS
========================================================= */

let enemies = [];

let bullets = [];

let pickups = [];

let particles = [];


/* =========================================================
   HELPERS
========================================================= */

function random(min, max) {

  return min +
    Math.random() *
    (max - min);
}


function laneX(lane) {

  return WIDTH *
    (
      0.25 +
      lane * 0.25
    );
}


function playerY() {

  return HEIGHT * 0.83;
}


function clamp(value, min, max) {

  return Math.max(
    min,
    Math.min(max, value)
  );
}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

  gameRunning = true;

  score = 0;

  health = 3;

  powerTime = 0;

  playerLane = 1;

  level = 1;

  spawnTimer = 0.2;

  fireTimer = 0;

  enemies = [];

  bullets = [];

  pickups = [];

  particles = [];

  scoreElement.textContent = "0";

  hpElement.textContent = "3";

  powerElement.textContent = "—";

  startScreen.style.display = "none";

  lastTime =
    performance.now();

  requestAnimationFrame(gameLoop);
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver() {

  gameRunning = false;

  titleElement.textContent =
    "GAME OVER";

  descriptionElement.innerHTML =
    "Your score was <b>" +
    score +
    "</b>." +
    "<br><br>" +
    "Tap PLAY AGAIN to try again.";

  startButton.textContent =
    "PLAY AGAIN";

  startScreen.style.display =
    "flex";
}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function movePlayer(direction) {

  if (!gameRunning)
    return;

  playerLane = clamp(
    playerLane + direction,
    0,
    2
  );
}


function chooseLaneFromTouch(x) {

  const lane =
    Math.round(
      (x / WIDTH - 0.25) / 0.25
    );

  playerLane =
    clamp(lane, 0, 2);
}


/* =========================================================
   TOUCH CONTROLS
========================================================= */

let touchStartX = 0;
let touchStartY = 0;


canvas.addEventListener(
  "touchstart",
  function(event) {

    if (!gameRunning) {

      startGame();

      return;
    }

    const touch =
      event.changedTouches[0];

    touchStartX =
      touch.clientX;

    touchStartY =
      touch.clientY;

  },
  { passive: false }
);


canvas.addEventListener(
  "touchend",
  function(event) {

    event.preventDefault();

    if (!gameRunning)
      return;

    const touch =
      event.changedTouches[0];

    const dx =
      touch.clientX -
      touchStartX;

    const dy =
      touch.clientY -
      touchStartY;

    if (
      Math.abs(dx) > 30 &&
      Math.abs(dx) > Math.abs(dy)
    ) {

      if (dx > 0)
        movePlayer(1);
      else
        movePlayer(-1);

    } else {

      chooseLaneFromTouch(
        touch.clientX
      );
    }

  },
  { passive: false }
);


/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

window.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "ArrowLeft" ||
      event.key === "a"
    ) {

      movePlayer(-1);

    }

    if (
      event.key === "ArrowRight" ||
      event.key === "d"
    ) {

      movePlayer(1);

    }

    if (
      event.key === "Enter" ||
      event.key === " "
    ) {

      if (!gameRunning)
        startGame();

    }

  }
);


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
  "click",
  function(event) {

    event.preventDefault();

    startGame();

  }
);


startButton.addEventListener(
  "touchend",
  function(event) {

    event.preventDefault();

    startGame();

  },
  { passive: false }
);


/* =========================================================
   ENEMIES
========================================================= */

function createEnemy() {

  const tank =
    Math.random() < 0.16;

  enemies.push({

    lane:
      Math.floor(
        Math.random() * 3
      ),

    y: -50,

    speed:
      random(75,108) +
      level * 4,

    hp:
      tank ? 3 : 1,

    maxHp:
      tank ? 3 : 1,

    tank:
      tank

  });

}


/* =========================================================
   POWER UPS
========================================================= */

function createPickup() {

  pickups.push({

    lane:
      Math.floor(
        Math.random() * 3
      ),

    y: -30,

    type:
      Math.random() < 0.55
        ? "rapid"
        : "heal",

    rotation: 0

  });

}


/* =========================================================
   SHOOTING
========================================================= */

function shoot() {

  bullets.push({

    lane:
      playerLane,

    y:
      playerY() - 65,

    damage:
      powerTime > 0
        ? 2
        : 1

  });

}


/* =========================================================
   PARTICLES
========================================================= */

function explosion(
  px,
  py,
  count
) {

  for (
    let i = 0;
    i < count;
    i++
  ) {

    particles.push({

      x: px,

      y: py,

      vx:
        random(-110,110),

      vy:
        random(-150,30),

      life: 0.5,

      maxLife: 0.5

    });

  }

}


/* =========================================================
   UPDATE
========================================================= */

function update(delta) {

  level =
    1 +
    Math.floor(score / 20);


  /* SPAWNING */

  spawnTimer -= delta;

  if (spawnTimer <= 0) {

    createEnemy();

    spawnTimer =
      Math.max(
        0.38,
        1.05 -
        level * 0.035
      );

  }


  /* SHOOTING */

  fireTimer -= delta;

  if (fireTimer <= 0) {

    shoot();

    fireTimer =
      powerTime > 0
        ? 0.17
        : 0.31;

  }


  /* RANDOM POWER UPS */

  if (
    Math.random() <
    delta * 0.05
  ) {

    createPickup();

  }


  /* BULLETS */

  for (
    const bullet of bullets
  ) {

    bullet.y -=
      680 * delta;

  }


  /* ENEMIES */

  for (
    const enemy of enemies
  ) {

    enemy.y +=
      enemy.speed * delta;

  }


  /* POWER UPS */

  for (
    const pickup of pickups
  ) {

    pickup.y +=
      95 * delta;

    pickup.rotation +=
      delta * 5;

  }


  /* PARTICLES */

  for (
    const particle of particles
  ) {

    particle.x +=
      particle.vx * delta;

    particle.y +=
      particle.vy * delta;

    particle.vy +=
      260 * delta;

    particle.life -=
      delta;

  }


  /* BULLET COLLISION */

  for (
    const bullet of bullets
  ) {

    if (bullet.dead)
      continue;

    for (
      const enemy of enemies
    ) {

      if (
        enemy.dead ||
        enemy.lane !== bullet.lane
      )
        continue;

      if (
        Math.abs(
          enemy.y -
          bullet.y
        ) < 32
      ) {

        enemy.hp -=
          bullet.damage;

        bullet.dead = true;

        explosion(
          laneX(enemy.lane),
          enemy.y,
          5
        );

        if (
          enemy.hp <= 0
        ) {

          enemy.dead = true;

          score +=
            enemy.tank
              ? 3
              : 1;

          explosion(
            laneX(enemy.lane),
            enemy.y,
            15
          );

        }

        break;

      }

    }

  }


  /* ENEMY REACHES PLAYER */

  for (
    const enemy of enemies
  ) {

    if (
      enemy.dead
    )
      continue;

    if (
      enemy.y >
      playerY() - 45
    ) {

      enemy.dead = true;

      health--;

      shakeTimer =
        0.15;

      explosion(
        laneX(enemy.lane),
        playerY() - 30,
        15
      );

      if (
        health <= 0
      ) {

        health = 0;

        hpElement.textContent =
          "0";

        gameOver();

        return;

      }

    }

  }


  /* PICKUP COLLECTION */

  for (
    const pickup of pickups
  ) {

    if (pickup.dead)
      continue;

    if (
      pickup.lane ===
        playerLane &&
      Math.abs(
        pickup.y -
        (playerY() - 35)
      ) < 45
    ) {

      pickup.dead = true;

      if (
        pickup.type === "rapid"
      ) {

        powerTime = 6;

      } else {

        health =
          Math.min(
            3,
            health + 1
          );

      }

      explosion(
        laneX(pickup.lane),
        pickup.y,
        12
      );

    }

  }


  /* POWER TIMER */

  powerTime =
    Math.max(
      0,
      powerTime - delta
    );


  /* CLEANUP */

  enemies =
    enemies.filter(
      enemy =>
        !enemy.dead &&
        enemy.y < HEIGHT + 80
    );

  bullets =
    bullets.filter(
      bullet =>
        !bullet.dead &&
        bullet.y > -80
    );

  pickups =
    pickups.filter(
      pickup =>
        !pickup.dead &&
        pickup.y < HEIGHT + 60
    );

  particles =
    particles.filter(
      particle =>
        particle.life > 0
    );


  /* HUD */

  scoreElement.textContent =
    score;

  hpElement.textContent =
    health;

  powerElement.textContent =
    powerTime > 0
      ? "RAPID"
      : "—";


  shakeTimer =
    Math.max(
      0,
      shakeTimer - delta
    );

}


/* =========================================================
   DRAW ROAD
========================================================= */

function drawRoad() {

  const horizon =
    HEIGHT * 0.14;


  /* SKY */

  const sky =
    ctx.createLinearGradient(
      0,
      0,
      0,
      HEIGHT
    );

  sky.addColorStop(
    0,
    "#203744"
  );

  sky.addColorStop(
    0.3,
    "#30363d"
  );

  sky.addColorStop(
    1,
    "#111318"
  );

  ctx.fillStyle =
    sky;

  ctx.fillRect(
    0,
    0,
    WIDTH,
    HEIGHT
  );


  /* ROAD */

  ctx.fillStyle =
    "#252a30";

  ctx.beginPath();

  ctx.moveTo(
    WIDTH * .34,
    horizon
  );

  ctx.lineTo(
    WIDTH * .66,
    horizon
  );

  ctx.lineTo(
    WIDTH * .91,
    HEIGHT
  );

  ctx.lineTo(
    WIDTH * .09,
    HEIGHT
  );

  ctx.closePath();

  ctx.fill();


  /* LANE LINES */

  ctx.strokeStyle =
    "rgba(255,255,255,.17)";

  ctx.lineWidth = 3;

  ctx.setLineDash([
    22,
    20
  ]);

  for (
    let i = 1;
    i < 3;
    i++
  ) {

    ctx.beginPath();

    ctx.moveTo(
      WIDTH *
      (.34 + i * .16),
      horizon
    );

    ctx.lineTo(
      WIDTH *
      (.09 + i * .41),
      HEIGHT
    );

    ctx.stroke();

  }

  ctx.setLineDash([]);


  /* ROAD EDGES */

  ctx.strokeStyle =
    "rgba(255,211,75,.5)";

  ctx.lineWidth = 5;

  ctx.beginPath();

  ctx.moveTo(
    WIDTH * .34,
    horizon
  );

  ctx.lineTo(
    WIDTH * .09,
    HEIGHT
  );

  ctx.moveTo(
    WIDTH * .66,
    horizon
  );

  ctx.lineTo(
    WIDTH * .91,
    HEIGHT
  );

  ctx.stroke();

}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer() {

  const px =
    laneX(playerLane);

  const py =
    playerY() - 20;


  ctx.save();

  ctx.translate(
    px,
    py
  );


  /* SHADOW */

  ctx.fillStyle =
    "rgba(0,0,0,.45)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    30,
    30,
    9,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* LEGS */

  ctx.strokeStyle =
    "#15191e";

  ctx.lineWidth = 8;

  ctx.beginPath();

  ctx.moveTo(
    -8,
    9
  );

  ctx.lineTo(
    -12,
    29
  );

  ctx.moveTo(
    8,
    9
  );

  ctx.lineTo(
    12,
    29
  );

  ctx.stroke();


  /* BODY */

  ctx.fillStyle =
    "#2878e6";

  ctx.fillRect(
    -18,
    -18,
    36,
    29
  );


  /* HEAD */

  ctx.fillStyle =
    "#ffd0aa";

  ctx.beginPath();

  ctx.arc(
    0,
    -31,
    14,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* HELMET */

  ctx.fillStyle =
    "#173d73";

  ctx.beginPath();

  ctx.arc(
    0,
    -34,
    15,
    Math.PI,
    0
  );

  ctx.fill();


  /* GUN */

  ctx.strokeStyle =
    "#22272d";

  ctx.lineWidth = 8;

  ctx.beginPath();

  ctx.moveTo(
    10,
    -7
  );

  ctx.lineTo(
    32,
    -19
  );

  ctx.stroke();


  /* POWER AURA */

  if (powerTime > 0) {

    ctx.strokeStyle =
      "rgba(255,224,68,.7)";

    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.arc(
      0,
      -8,
      35,
      0,
      Math.PI * 2
    );

    ctx.stroke();

  }


  ctx.restore();

}


/* =========================================================
   DRAW ENEMY
========================================================= */

function drawEnemy(enemy) {

  const px =
    laneX(enemy.lane);

  const py =
    enemy.y;

  const scale =
    enemy.tank
      ? 1.18
      : 1;


  ctx.save();

  ctx.translate(
    px,
    py
  );


  /* SHADOW */

  ctx.fillStyle =
    "rgba(0,0,0,.4)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    29 * scale,
    25 * scale,
    8 * scale,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* LEGS */

  ctx.strokeStyle =
    "#17191d";

  ctx.lineWidth =
    7 * scale;

  ctx.beginPath();

  ctx.moveTo(
    -8 * scale,
    10
  );

  ctx.lineTo(
    -11 * scale,
    28
  );

  ctx.moveTo(
    8 * scale,
    10
  );

  ctx.lineTo(
    11 * scale,
    28
  );

  ctx.stroke();


  /* BODY */

  ctx.fillStyle =
    enemy.tank
      ? "#687785"
      : "#d34a38";

  ctx.fillRect(
    -17 * scale,
    -5 * scale,
    34 * scale,
    27 * scale
  );


  /* HEAD */

  ctx.fillStyle =
    enemy.tank
      ? "#b8c2ca"
      : "#f0b18b";

  ctx.beginPath();

  ctx.arc(
    0,
    -19 * scale,
    13 * scale,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* WEAPON */

  ctx.strokeStyle =
    "#24282d";

  ctx.lineWidth =
    6 * scale;

  ctx.beginPath();

  ctx.moveTo(
    13 * scale,
    3
  );

  ctx.lineTo(
    29 * scale,
    13
  );

  ctx.stroke();


  /* HEALTH BAR */

  if (
    enemy.maxHp > 1
  ) {

    ctx.fillStyle =
      "rgba(0,0,0,.55)";

    ctx.fillRect(
      -20,
      -39,
      40,
      5
    );

    ctx.fillStyle =
      "#65e66e";

    ctx.fillRect(
      -20,
      -39,
      40 *
      (enemy.hp /
       enemy.maxHp),
      5
    );

  }


  ctx.restore();

}


/* =========================================================
   DRAW BULLETS
========================================================= */

function drawBullet(
  bullet
) {

  const px =
    laneX(bullet.lane);


  ctx.strokeStyle =
    "#fff09a";

  ctx.lineWidth = 5;

  ctx.beginPath();

  ctx.moveTo(
    px,
    bullet.y - 14
  );

  ctx.lineTo(
    px,
    bullet.y + 8
  );

  ctx.stroke();

}


/* =========================================================
   DRAW PICKUPS
========================================================= */

function drawPickup(
  pickup
) {

  const px =
    laneX(pickup.lane);


  ctx.save();

  ctx.translate(
    px,
    pickup.y
  );

  ctx.rotate(
    Math.sin(
      pickup.rotation
    ) * .12
  );


  ctx.fillStyle =
    pickup.type === "rapid"
      ? "#ffd62e"
      : "#43db79";


  ctx.beginPath();

  ctx.arc(
    0,
    0,
    18,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.fillStyle =
    "#182018";

  ctx.font =
    "bold 18px system-ui";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  ctx.fillText(
    pickup.type === "rapid"
      ? "⚡"
      : "♥",
    0,
    1
  );


  ctx.restore();

}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles() {

  for (
    const particle of particles
  ) {

    ctx.globalAlpha =
      Math.max(
        0,
        particle.life /
        particle.maxLife
      );

    ctx.fillStyle =
      "#ffd43b";

    ctx.fillRect(
      particle.x,
      particle.y,
      4,
      4
    );

  }

  ctx.globalAlpha = 1;

}


/* =========================================================
   DRAW EVERYTHING
========================================================= */

function draw() {

  ctx.save();


  if (
    shakeTimer > 0
  ) {

    ctx.translate(
      random(-4,4),
      random(-4,4)
    );

  }


  drawRoad();


  for (
    const pickup of pickups
  ) {

    drawPickup(
      pickup
    );

  }


  for (
    const bullet of bullets
  ) {

    drawBullet(
      bullet
    );

  }


  for (
    const enemy of enemies
  ) {

    drawEnemy(
      enemy
    );

  }


  drawPlayer();

  drawParticles();


  ctx.restore();

}


/* =========================================================
   MAIN LOOP
========================================================= */

function gameLoop(time) {

  if (!gameRunning)
    return;


  const delta =
    Math.min(
      0.033,
      (time - lastTime) /
      1000
    );


  lastTime = time;


  update(delta);

  draw();


  if (gameRunning) {

    requestAnimationFrame(
      gameLoop
    );

  }

}


/* =========================================================
   INITIAL SCREEN
========================================================= */

drawRoad();

drawPlayer();

</script>
