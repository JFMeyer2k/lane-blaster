<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Army Gate Rush</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9e3f4;font-family:Arial,Helvetica,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 3px #000}
#top{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 12px;padding-top:max(12px,env(safe-area-inset-top))}
.badge{background:rgba(18,34,49,.82);border:2px solid rgba(255,255,255,.3);border-radius:14px;padding:7px 11px;font-weight:900;font-size:15px}
#armyBadge{font-size:19px}
#barWrap{position:absolute;top:58px;left:16%;right:16%;height:9px;border-radius:8px;background:#193040aa;border:1px solid #ffffff88;overflow:hidden}
#bar{height:100%;width:4%;background:#35d7ff}
#weapon{position:absolute;left:50%;transform:translateX(-50%);top:74px}
#start,#end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,15,24,.66);z-index:10}
.card{width:min(88vw,420px);background:rgba(16,31,43,.96);border:1px solid #ffffff33;border-radius:25px;padding:26px;text-align:center;color:#fff;box-shadow:0 25px 70px #0009}
.card h1{font-size:32px;margin:0 0 8px;letter-spacing:-1px}.card p{line-height:1.45;color:#dbeaf0}
button{width:100%;border:0;border-radius:16px;padding:16px;background:#18c9ff;color:#04202a;font-weight:1000;font-size:19px}
.small{font-size:12px;color:#9fb6c0;margin-top:12px}
#tip{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#0c2433c9;padding:9px 14px;border-radius:18px;font-size:13px;white-space:nowrap}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div id="top">
  <div class="badge">👥 <span id="army">8</span></div>
  <div class="badge">🪙 <span id="coins">0</span></div>
 </div>
 <div id="barWrap"><div id="bar"></div></div>
 <div id="weapon" class="badge">🔫 RIFLE 1</div>
 <div id="tip">DRAG LEFT / RIGHT • CHOOSE THE BETTER GATE</div>
</div>
<div id="start"><div class="card">
 <h1>ARMY GATE RUSH</h1>
 <p>Move your squad left and right. Shoot through gates, collect weapons, multiply your army and destroy the enemy commander.</p>
 <button id="play">PLAY</button>
 <div class="small">Original 3D browser game inspired by the mobile army-runner ad genre.</div>
</div></div>
<div id="end"><div class="card">
 <h1 id="result">VICTORY!</h1><p id="resultText"></p><button id="again">PLAY AGAIN</button>
</div></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bdced);
scene.fog=new THREE.Fog(0x9bdced,35,145);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,220);
camera.position.set(0,9.5,15);camera.lookAt(0,1,-25);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xeaffff,0x365348,2.5));
const sun=new THREE.DirectionalLight(0xffffff,3.5);
sun.position.set(-15,25,15);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.72,metalness:0});
const blue=M(0x1387d1),blueLight=M(0x43c7ff),white=M(0xf2f2e8),skin=M(0xd99a6a),pants=M(0x1974c5),boots=M(0x26313a);
const red=M(0xd8323d),redLight=M(0xff555e),dark=M(0x17232c),gold=M(0xffc72e);
const gateBlue=M(0x168de0),gateRed=M(0xe43b43),roadM=M(0x667178),railM=M(0xdbe5e6),waterM=M(0x279bc0);

let running=false,army=8,coins=0,weapon=1,targetX=0,worldZ=0,gateIndex=0,boss=null;
let soldiers=[],enemies=[],gates=[],crates=[],bullets=[],fx=[];
let fireClock=0,spawnClock=0,last=performance.now();

function mesh(g,m,pos){
 const o=new THREE.Mesh(g,m);if(pos)o.position.set(...pos);o.castShadow=true;o.receiveShadow=true;return o;
}
function makeSoldier(isEnemy=false){
 const g=new THREE.Group();
 const body=mesh(new THREE.SphereGeometry(.32,12,8),isEnemy?red:blue,[0,1.25,0]);body.scale.set(1,1.15,.72);
 const shirt=mesh(new THREE.BoxGeometry(.48,.55,.34),isEnemy?red:blue,[0,1.02,0]);
 const head=mesh(new THREE.SphereGeometry(.27,12,9),skin,[0,1.78,0]);
 const helmet=mesh(new THREE.SphereGeometry(.31,12,8,0,Math.PI*2,0,Math.PI*.55),isEnemy?redLight:blueLight,[0,1.9,0]);
 const brim=mesh(new THREE.BoxGeometry(.48,.07,.32),isEnemy?redLight:blueLight,[0,1.82,.09]);
 const l=mesh(new THREE.BoxGeometry(.14,.55,.15),isEnemy?red:blue,[-.34,1.08,0]);
 const r=l.clone();r.position.x=.34;
 const ll=mesh(new THREE.BoxGeometry(.16,.5,.17),pants,[-.14,.45,0]);
 const rr=ll.clone();rr.position.x=.14;
 const gun=mesh(new THREE.BoxGeometry(.1,.1,.68),dark,[0,1.2,-.42]);
 g.add(body,shirt,head,helmet,brim,l,r,ll,rr,gun);
 g.userData={enemy:isEnemy,hp:isEnemy?3:0,phase:Math.random()*6.28,gun};
 return g;
}

function rebuild(){
 while(soldiers.length<army){let s=makeSoldier(false);scene.add(s);soldiers.push(s)}
 while(soldiers.length>army)scene.remove(soldiers.pop());
}
function layout(){
 const n=soldiers.length,cols=Math.min(7,Math.max(2,Math.ceil(Math.sqrt(n))));
 soldiers.forEach((s,i)=>{
  const row=Math.floor(i/cols),col=i%cols;
  const x=(col-(cols-1)/2)*.78+(row%2?.12:0);
  const z=5.6+row*.72;
  s.position.x+=(targetX+x-s.position.x)*.16;
  s.position.z=z;s.position.y=Math.sin(performance.now()/115+s.userData.phase)*.035;
  s.rotation.y=Math.PI;
 });
}

const road=mesh(new THREE.BoxGeometry(13,.3,210),roadM,[0,-.3,-70]);scene.add(road);
const water=mesh(new THREE.PlaneGeometry(220,220),waterM);water.rotation.x=-Math.PI/2;water.position.set(0,-.53,-70);scene.add(water);
for(const x of [-7.15,7.15])scene.add(mesh(new THREE.BoxGeometry(.35,1.5,210),railM,[x,.35,-70]));
for(let z=8;z>-170;z-=7)scene.add(mesh(new THREE.BoxGeometry(.16,.03,3.2),white,[0,-.12,z]));
for(let z=-8;z>-160;z-=15){
 for(const x of [-11,11]){const t=mesh(new THREE.CylinderGeometry(.18,.25,1.4,7),M(0x70462b),[x,0,z]);const c=mesh(new THREE.ConeGeometry(1.2,2.8,8),M(0x27814b),[x,2,z]);}
}

function label(text,color){
 const c=document.createElement("canvas");c.width=700;c.height=280;const x=c.getContext("2d");
 x.clearRect(0,0,c.width,c.height);x.font="900 170px Arial";x.textAlign="center";x.textBaseline="middle";x.lineWidth=18;x.strokeStyle="#16415c";x.strokeText(text,350,145);x.fillStyle="#fff";x.fillText(text,350,145);
 const t=new THREE.CanvasTexture(c);const m=new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false});
 return new THREE.Mesh(new THREE.PlaneGeometry(3.4,1.35),m);
}
function makeGate(z,left,right){
 const g=new THREE.Group();g.position.z=z;g.userData={left,right,hit:false};
 for(const side of [-1,1]){
  const val=side<0?left:right,positive=val>0,matl=positive?gateBlue:gateRed,x=side*3.25;
  const post1=mesh(new THREE.BoxGeometry(.18,4.8,.24),matl,[x,2.35,0]);
  const post2=mesh(new THREE.BoxGeometry(.18,4.8,.24),matl,[x+side*.65,2.35,0]);
  const top=mesh(new THREE.BoxGeometry(3.9,.22,.24),matl,[x+side*.325,4.65,0]);
  const panel=mesh(new THREE.BoxGeometry(3.7,2.45,.12),matl,[x+side*.325,2.45,0]);
  panel.material.transparent=true;panel.material.opacity=.92;
  const lab=label(val.op+(val.n));lab.position.set(x+side*.325,2.55,-.1);g.add(post1,post2,top,panel,lab);
 }
 scene.add(g);gates.push(g);
}
function makeCrate(z,x=0){
 const c=mesh(new THREE.BoxGeometry(1.25,1.25,1.25),M(0xd99027),[x,1,z]);
 c.userData={weapon:true,spin:Math.random()*6};scene.add(c);crates.push(c);
}
function enemyWave(z,n){
 for(let i=0;i<n;i++){
  const e=makeSoldier(true);e.position.set((Math.random()-.5)*7.5,0,z-Math.random()*2.5);
  e.userData.hp=3+Math.floor(Math.abs(z)/60);e.userData.max=e.userData.hp;scene.add(e);enemies.push(e);
 }
}
function bullet(from,to){
 const d=new THREE.Vector3().subVectors(to,from),len=d.length();
 const b=mesh(new THREE.CylinderGeometry(.035,.035,len,5),gold);b.position.copy(from).add(to).multiplyScalar(.5);b.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());b.userData={v:d.multiplyScalar(38),life:1};scene.add(b);bullets.push(b);
}
function flash(p){
 const q=mesh(new THREE.SphereGeometry(.13,6,6),gold,p);fx.push({m:q,life:.09,v:new THREE.Vector3()});
}
function nearest(){
 let best=null,bd=1e9;
 for(const e of enemies){const d=e.position.distanceToSquared(new THREE.Vector3(targetX,1,worldZ-8));if(d<bd){bd=d;best=e}}
 return best;
}
function shoot(){
 const e=nearest();if(!e)return;
 const count=Math.min(soldiers.length,24);
 for(let i=0;i<count;i+=2){const s=soldiers[i];const p=s.position.clone().add(new THREE.Vector3(0,1.2,-.5));bullet(p,e.position.clone().add(new THREE.Vector3(0,1.1,0)));flash(p)}
}
function bossMake(){
 boss=makeSoldier(true);boss.scale.set(4,4,4);boss.position.set(0,0,-142);boss.userData.hp=180+army*3;boss.userData.max=boss.userData.hp;scene.add(boss);
 const r=mesh(new THREE.TorusGeometry(2.5,.1,8,32),gold,[0,4.7,0]);r.rotation.x=Math.PI/2;boss.add(r);
}
function reset(){
 running=true;army=8;coins=0;weapon=1;targetX=0;worldZ=0;boss=null;
 [...enemies,...gates,...crates,...bullets,...soldiers].forEach(o=>scene.remove(o));
 enemies=[];gates=[];crates=[];bullets=[];soldiers=[];
 rebuild();
 for(let z=-20;z>-130;z-=22){
  const choices=[
   [{op:"x",n:2},{op:"-",n:3}],
   [{op:"+",n:12},{op:"x",n:2}],
   [{op:"x",n:3},{op:"-",n:5}],
   [{op:"+",n:20},{op:"÷",n:2}],
   [{op:"x",n:4},{op:"+",n:8}],
   [{op:"-",n:4},{op:"x",n:2}]
  ];
  const c=choices[Math.floor(Math.random()*choices.length)];makeGate(z,c[0],c[1]);
 }
 enemyWave(-42,9);enemyWave(-69,12);enemyWave(-97,16);enemyWave(-122,20);
 makeCrate(-53,-2.7);makeCrate(-82,2.8);makeCrate(-111,0);
 document.getElementById("end").style.display="none";
 document.getElementById("tip").style.display="block";
}
function gateApply(g){
 const chosen=targetX<0?g.userData.left:g.userData.right;
 if(chosen.op==="x") army=Math.min(120,Math.floor(army*chosen.n));
 else if(chosen.op==="÷") army=Math.max(1,Math.floor(army/chosen.n));
 else army=Math.max(1,Math.min(120,army+(chosen.op==="-"?-chosen.n:chosen.n)));
 rebuild();g.userData.hit=true;
 for(let i=0;i<18;i++){const p=mesh(new THREE.SphereGeometry(.06,5,5),gold,[g.position.x/3,2,g.position.z]);scene.add(p);fx.push({m:p,life:.55,v:new THREE.Vector3((Math.random()-.5)*5,Math.random()*4,Math.random()*3)})}
}
function end(win){
 running=false;document.getElementById("result").textContent=win?"VICTORY!":"SQUAD LOST";
 document.getElementById("resultText").textContent=win?`You broke through with ${army} soldiers and ${coins} coins.`:`The enemy stopped your squad with ${army} soldiers left.`;
 document.getElementById("end").style.display="flex";
}
function update(dt){
 if(!running)return;
 worldZ-=dt*6.2;
 layout();
 camera.position.x+=(targetX*.28-camera.position.x)*.08;camera.position.z=15;camera.lookAt(targetX*.2,1.2,worldZ-24);

 for(const g of gates){g.position.z+=dt*6.2;if(!g.userData.hit&&g.position.z>worldZ+4)gateApply(g)}
 for(let i=gates.length-1;i>=0;i--)if(gates[i].position.z>22){scene.remove(gates[i]);gates.splice(i,1)}

 fireClock-=dt;if(fireClock<=0){shoot();fireClock=Math.max(.11,.28-weapon*.018)}
 for(const e of enemies){
  e.position.z+=dt*2.7;
  e.position.x+=(targetX-e.position.x)*dt*.08;
  if(e.position.z>worldZ+4){army=Math.max(1,army-1);e.userData.hp=0}
 }
 for(let i=enemies.length-1;i>=0;i--)if(enemies[i].userData.hp<=0){scene.remove(enemies[i]);enemies.splice(i,1)}

 for(const b of bullets){
  b.position.addScaledVector(b.userData.v,dt);b.userData.life-=dt;
  for(const e of enemies)if(e.position.distanceTo(b.position)<.7){e.userData.hp--;coins++;b.userData.life=0;break}
  if(boss&&boss.position.distanceTo(b.position)<2.0){boss.userData.hp--;coins++;b.userData.life=0}
 }
 for(let i=bullets.length-1;i>=0;i--)if(bullets[i].userData.life<=0){scene.remove(bullets[i]);bullets.splice(i,1)}

 for(let i=crates.length-1;i>=0;i--){const c=crates[i];c.rotation.y+=dt*1.8;if(Math.abs(c.position.z-worldZ)<2.8&&Math.abs(c.position.x-targetX)<2.1){weapon=Math.min(9,weapon+1);scene.remove(c);crates.splice(i);}}
 if(worldZ<-130&&!boss)bossMake();
 if(boss){boss.position.z+=dt*1.6;if(boss.userData.hp<=0)end(true);if(boss.position.z>worldZ+5)end(false)}
 if(army<=0)end(false);

 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.life-=dt;f.m.position.addScaledVector(f.v,dt);f.v.y-=8*dt;if(f.life<=0){scene.remove(f.m);fx.splice(i)}}
 document.getElementById("army").textContent=army;document.getElementById("coins").textContent=coins;
 document.getElementById("weapon").textContent="🔫 RIFLE "+weapon;
 document.getElementById("bar").style.width=Math.min(100,Math.max(3,-worldZ/145*100))+"%";
}
function loop(t){const dt=Math.min(.035,(t-last)/1000);last=t;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}
requestAnimationFrame(loop);

let down=false,lastX=0;
renderer.domElement.addEventListener("pointerdown",e=>{down=true;lastX=e.clientX});
renderer.domElement.addEventListener("pointermove",e=>{if(!down||!running)return;targetX=Math.max(-5.2,Math.min(5.2,targetX+(e.clientX-lastX)*.018));lastX=e.clientX});
renderer.domElement.addEventListener("pointerup",()=>down=false);renderer.domElement.addEventListener("pointercancel",()=>down=false);
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")targetX=Math.max(-5.2,targetX-.65);if(e.key==="ArrowRight")targetX=Math.min(5.2,targetX+.65)});
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.getElementById("play").onclick=()=>{reset();document.getElementById("start").style.display="none"};
document.getElementById("again").onclick=()=>reset();
</script>
</body>
</html>
